  <style>
/* KM Box — стиль в духе hookahbox.ru: чёрный, янтарный акцент, индустриальные полосы */
:root {
  --bg: #000;
  --panel: #111;
  --panel-2: #181818;
  --line: #2a2a2a;
  --text: #fff;
  --muted: #8d8d8d;
  --accent: #f9a01e;
  --accent-ink: #111;
  --danger: #f95d51;
  --ok: #62c584;
  --radius: 14px;
  --head: 'Oswald', 'Arial Narrow', Arial, sans-serif;
  --body: 'Roboto', Arial, sans-serif;
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 var(--body); }
body { min-height: 100vh; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, .head { font-family: var(--head); text-transform: uppercase; letter-spacing: .02em; font-weight: 600; margin: 0; }
h1 { font-size: 30px; line-height: 1.05; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
.muted { color: var(--muted); }
.accent { color: var(--accent); }
.small { font-size: 13px; }
.hidden { display: none !important; }

/* полосы «осторожно» как на сайте */
.stripes { height: 10px; background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, transparent 14px 28px); border-radius: 3px; opacity: .95; }
.stripes.thin { height: 6px; }

/* ---------- каркас ---------- */
.shell { display: flex; min-height: 100vh; }
.side { display: none; }
.main { flex: 1; min-width: 0; padding: 0 16px calc(var(--nav-h) + 24px + var(--safe-b)); max-width: 980px; margin: 0 auto; width: 100%; }
.topbar { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.92); backdrop-filter: blur(6px); display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
.brand .name { font-family: var(--head); font-weight: 700; font-size: 20px; letter-spacing: .04em; }
.brand .name b { color: var(--accent); }
.topbar .spacer { flex: 1; }
.venue-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.venue-switch button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-family: var(--head); text-transform: uppercase; font-size: 13px; letter-spacing: .04em; color: var(--muted); }
.venue-switch button.on { background: var(--accent); color: var(--accent-ink); }

.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: #070707; border-top: 1px solid var(--line); padding-bottom: var(--safe-b); }
.bottomnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--nav-h); color: var(--muted); text-decoration: none; font-size: 11px; font-family: var(--head); text-transform: uppercase; letter-spacing: .04em; }
.bottomnav a svg { width: 22px; height: 22px; }
.bottomnav a.on { color: var(--accent); }

@media (min-width: 900px) {
  .bottomnav { display: none; }
  .side { display: flex; flex-direction: column; gap: 4px; width: 230px; flex: none; position: sticky; top: 0; height: 100vh; padding: 18px 14px; border-right: 1px solid var(--line); background: #050505; }
  .side .brand { margin: 0 6px 18px; }
  .side a.nav { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #cfcfcf; text-decoration: none; font-family: var(--head); text-transform: uppercase; letter-spacing: .04em; }
  .side a.nav svg { width: 20px; height: 20px; }
  .side a.nav:hover { background: var(--panel); }
  .side a.nav.on { background: var(--accent); color: var(--accent-ink); }
  .side .foot { margin-top: auto; }
  .topbar .brand { display: none; }
  .main { padding: 0 32px 40px; }
}

/* ---------- элементы ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.card + .card { margin-top: 12px; }
.grid { display: grid; gap: 12px; }
.grid.two { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
.grid > .btn { white-space: normal; text-align: center; }
.grid > * { min-width: 0; }
@media (min-width: 700px) { .grid.four { grid-template-columns: repeat(4, 1fr); } .grid.three { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 699px) { .grid.four, .grid.three { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack > * + * { margin-top: 12px; }
.section { margin: 22px 0 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 11px 16px; border-radius: 999px; cursor: pointer; font-family: var(--head); text-transform: uppercase; letter-spacing: .05em; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: #444; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: #4a201d; }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 12px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: default; }
.iconbtn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; width: 38px; height: 38px; display: inline-grid; place-items: center; cursor: pointer; color: var(--text); flex: none; }

.tile { display: flex; flex-direction: column; gap: 10px; justify-content: space-between; min-height: 120px; text-decoration: none; color: var(--text); cursor: pointer; position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 16px; text-align: left; }
.tile:hover { border-color: var(--accent); }
.tile .ico { width: 34px; height: 34px; color: var(--accent); }
.tile .t { font-family: var(--head); text-transform: uppercase; font-size: 18px; letter-spacing: .03em; }
.tile.hot { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tile.hot .ico { color: var(--accent-ink); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; background: #262626; color: #ddd; white-space: nowrap; }
.badge.acc { background: rgba(249,160,30,.16); color: var(--accent); }
.badge.red { background: rgba(249,93,81,.16); color: var(--danger); }
.badge.green { background: rgba(98,197,132,.16); color: var(--ok); }

label.f { display: block; }
label.f > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; font-family: var(--head); }
.input, select.input, textarea.input { width: 100%; background: #0b0b0b; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none; }
.input:focus { border-color: var(--accent); }
textarea.input { min-height: 80px; resize: vertical; }
.search { position: relative; }
.search .input { padding-left: 38px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.seg button, .chip { border: 1px solid var(--line); background: #0b0b0b; color: #ddd; border-radius: 999px; padding: 8px 13px; cursor: pointer; font-size: 14px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip.like { background: rgba(98,197,132,.15); border-color: var(--ok); color: #bff0cf; }
.chip.like::before { content: '♥ '; color: var(--ok); }
.chip.dislike { background: rgba(249,93,81,.12); border-color: var(--danger); color: #ffc2bd; text-decoration: line-through; }
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

.check { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

input[type=range] { width: 100%; accent-color: var(--accent); }
.scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }

/* списки */
.list { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
.li:first-child { border-top: 0; }
.li:hover { background: #151515; }
.li .grow { flex: 1; min-width: 0; }
.li .title { font-weight: 500; }
.li .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: #222; display: grid; place-items: center; font-family: var(--head); color: var(--accent); flex: none; }

/* чек-лист смены */
.cl-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
.cl-item:first-child { border-top: 0; }
.cl-item .mark { width: 44px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; border: 1px solid var(--line); flex: none; font-size: 13px; }
.cl-item .mark.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.cl-item .txt { flex: 1; }

/* остатки */
details.blk { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin-bottom: 10px; overflow: hidden; }
details.blk > summary { list-style: none; cursor: pointer; padding: 13px 14px; display: flex; align-items: center; gap: 10px; }
details.blk > summary::-webkit-details-marker { display: none; }
details.blk > summary .bn { font-family: var(--head); text-transform: uppercase; font-size: 17px; letter-spacing: .03em; flex: 1; }
details.blk > summary .chev { transition: transform .2s; color: var(--muted); }
details.blk[open] > summary .chev { transform: rotate(90deg); }
.fl { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 9px 14px; border-top: 1px solid var(--line); }
.fl .nm { min-width: 0; }
.fl .nm small { display: block; color: var(--muted); font-size: 12px; }
.fl .num { font-variant-numeric: tabular-nums; text-align: right; min-width: 56px; }
.fl.low .num.st { color: var(--danger); }
.fl input.input { width: 92px; text-align: right; padding: 8px 10px; }
.fl.filled { background: rgba(249,160,30,.05); }
.bar { height: 6px; border-radius: 3px; background: #222; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }

.sticky-actions { position: sticky; bottom: calc(var(--nav-h) + var(--safe-b) + 8px); z-index: 10; display: flex; gap: 8px; padding: 10px; background: rgba(10,10,10,.95); border: 1px solid var(--line); border-radius: 999px; margin-top: 16px; }
@media (min-width: 900px) { .sticky-actions { bottom: 16px; } }
.sticky-actions .btn { flex: 1; }

/* микс */
.mix { border: 2px solid var(--accent); border-radius: var(--radius); padding: 16px; background: linear-gradient(180deg, rgba(249,160,30,.08), transparent 60%), var(--panel); }
.mix-part { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px dashed #333; }
.mix-part:first-of-type { border-top: 0; }
.mix-part .pct { font-family: var(--head); font-size: 26px; color: var(--accent); }
.mix-part .g { font-family: var(--head); font-size: 18px; }
.mix-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 10px 0 4px; }
.mix-bar i:nth-child(1) { background: var(--accent); }
.mix-bar i:nth-child(2) { background: #fff; }
.mix-bar i:nth-child(3) { background: #777; }
.timer-big { font-family: var(--head); font-size: 54px; letter-spacing: .03em; line-height: 1; }
.timer-pill { position: fixed; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 68px); z-index: 40; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 9px 14px; font-family: var(--head); font-size: 15px; box-shadow: 0 6px 24px rgba(0,0,0,.6); cursor: pointer; border: 0; }
@media (min-width: 900px) { .timer-pill { top: 76px; right: 24px; } }
.timer-pill.done { background: var(--danger); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* модалки и тосты */
.modal-wrap { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.75); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 700px) { .modal-wrap { align-items: center; } }
.modal { background: #0d0d0d; border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; padding: 18px 18px calc(18px + var(--safe-b)); }
@media (min-width: 700px) { .modal { border-radius: 18px; } }
.modal .btn { white-space: normal; text-align: center; }
.modal .mh { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.modal img.shot { width: 100%; border-radius: 8px; background: #fff; display: block; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: 16px; z-index: 200; background: #1d1d1d; border: 1px solid var(--line); color: #fff; padding: 11px 16px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.6); max-width: calc(100% - 32px); }
.toast.err { border-color: var(--danger); }
.toast.ok { border-color: var(--ok); }

/* вход */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 70% 10%, rgba(249,160,30,.18), transparent 50%), #000; }
.login .box { width: 100%; max-width: 380px; }
.login .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.login h1 { font-size: 40px; }

.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 8px 14px; }
.kv dt { color: var(--muted); font-size: 13px; text-transform: uppercase; font-family: var(--head); letter-spacing: .05em; }
.kv dd { margin: 0; white-space: pre-wrap; }
@media (max-width: 500px) { .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 10px; } }
table.t { width: 100%; border-collapse: collapse; }
table.t td, table.t th { padding: 8px 6px; border-top: 1px solid var(--line); text-align: left; }
table.t th { font-family: var(--head); text-transform: uppercase; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .05em; }

</style>
</head>

        ['Оборудование (печь и тд) и свет в рабочей зоне выключены', '+'],
        ['Вытяжка выключена', '+'],
        ['Смена в АЙКО закрыта', '+'],
      ],
    },
  };

  // ---------------- даты ----------------
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dmy = (d) => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`;
  const fromYmd = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const daysBetween = (a, b) => Math.round((fromYmd(b) - fromYmd(a)) / 86400000);

  /** Дата для отчёта: при закрытии с 00:00 до 04:00 — предыдущий день */
  function shiftDate(kind, now) {
    const d = new Date(now || Date.now());
    if (kind === 'close' && d.getHours() < 4) d.setDate(d.getDate() - 1);
    return d;
  }

  /** Нужна ли инвента: воскресенье после 12:30 и за сегодня по заведению её нет */
  function inventoryDue(inventories, venue, now) {
    const d = new Date(now || Date.now());
    if (d.getDay() !== 0) return false;
    if (d.getHours() * 60 + d.getMinutes() < 12 * 60 + 30) return false;
    const today = ymd(d);
    return !inventories.some((i) => i.venue === venue && i.date === today);
  }

  // ---------------- остатки и расчёт заказа ----------------
  function sortedInv(inventories, venue) {
    return inventories.filter((i) => i.venue === venue).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  }

  /** Текущие остатки: последнее известное значение по каждой позиции */
  function currentStock(inventories, venue) {
    const res = {};
    for (const inv of sortedInv(inventories, venue)) {
      for (const [fid, it] of Object.entries(inv.items || {})) {
        if (it && typeof it.stock === 'number') res[fid] = { stock: it.stock, date: inv.date };
      }
    }
    return res;
  }

  /**
   * Расход позиции за последние ~2 недели.
   * Между двумя инвентами: было + заказали − стало (отрицательное = 0).
   * chain — инвенты по возрастанию даты (последняя может быть новой, ещё не сохранённой).
   */
  function usage(chain, fid, weeks) {
    weeks = weeks || 2;
    if (chain.length < 2) return { spent: 0, days: 0, weekly: 0 };
    const last = chain[chain.length - 1];
    let spent = 0, days = 0;
    for (let i = chain.length - 1; i > 0; i--) {
      const cur = chain[i], prev = chain[i - 1];
      const gap = daysBetween(prev.date, cur.date);
      if (gap <= 0) continue;
      if (days >= weeks * 7 - 2) break; // взяли достаточно интервалов
      const p = prev.items && prev.items[fid];
      const c = cur.items && cur.items[fid];
      days += gap;
      if (!p || typeof p.stock !== 'number' || !c || typeof c.stock !== 'number') continue;
      const s = p.stock + (p.order || 0) - c.stock;
      if (s > 0) spent += s;
    }
    void last;
    const weekly = days ? (spent / days) * 7 : 0;
    return { spent: Math.round(spent), days, weekly };
  }

  /**
   * Рекомендованный заказ.
   * Закупаем, если остатка не хватит на cover недель + резерв.
   * Кол-во округляем вверх до шага пополнения бренда (мин. 40 г).
   */
  function suggestOrder(stock, use, step, params) {
    params = params || {};
    const coverWeeks = params.coverWeeks || 1.5;
    const reserve = params.reserve != null ? params.reserve : 30;
    const minStep = params.minStep || 40;
    step = Math.max(minStep, step || minStep);
    if (!use.weekly || use.weekly < 1) return 0;
    const need = use.weekly * coverWeeks + reserve - (stock || 0);
    if (need <= 0) return 0;
    return Math.ceil(need / step) * step;
  }

  // ---------------- профили вкусов ----------------
  // tag: [regex по названию], sour — кислотность 0..1 (0.5 нейтрально)
  const TAGS = {
    berry: { label: 'Ягоды', re: /ягод|berry|клубни|землян|малин|черник|голубик|ежевик|смородин|currant|клюкв|cranberr|брусник|вишн|cherry|черешн|kriek|крыжовник|бузин|elderberr|ирга|berserk|годжи|облепих|рябин|княженик|жимолост|haskap|strawberr|raspberr|blueberr|schnozz|кизил|acid|барбарис|barberr/i },
    citrus: { label: 'Цитрус', re: /лимон|lemon|лайм|lime|апельсин|orange|грейпфрут|grapefruit|помело|pomel|мандарин|клементин|vita|бергамот|bergam|цитрус|citrus|mimon|юзу|yuzu/i },
    tropic: { label: 'Тропики', re: /манго|mango|маракуй|passion|ананас|pineapple|ananas|папай|papaya|гуав|guava|личи|lychee|тропи|tropic|банан|banana|кокос|coconut|киви|kiwi|фейхоа|feijoa|green beam|мультифрукт|mixed fruit|space flavour|aloha/i },
    fruit: { label: 'Фрукты', re: /яблок|apple|груш|pear|персик|peach|абрикос|apricot|курага|слив|plum|tanos|виноград|grape|арбуз|watermelon|дын|melon|гранат|нектарин|чернослив|prunes|инжир|fig|тыкв|halloween|фрукт|panama|кактус|cactus/i },
    dessert: { label: 'Десерт', re: /десерт|печень|cookie|вафл|waffle|пончик|donut|pon pon|пышк|оладуш|чизкейк|cheesecake|брауни|browni|шоколад|chocolate|карамел|caramel|ирис|candy|конфет|марципан|marzipan|пудинг|pudding|крамбл|crumb|пирог|маршмел|мороже|ice cream|iced cream|ice snow|black&white|хлопья|cereal|каша|rice|трюфел|truffle|fifi|пастил|сгущ|killer milk|мёд|мед|honey|ваниль|vanil|джем|jam|skittles|скиттлз|жвачк|gum|орбит|bubble/i },
    creamy: { label: 'Сливочное', re: /сливк|сливоч|cream|крем|йогурт|yogurt|молоч|milk|baileys|бейлис|шейк|shake|творож|cheese|welsh|horchata|орчат/i },
    drink: { label: 'Напитки', re: /лимонад|lemonade|морс|сок|juice|газиров|soda|кола|cola|энергетик|energ|джин|gin|ром|rum|виски|whisk|пиво|guinness|вино|белое сухое|порто|абсент|абсинт|бормотух|настойк|fantola|frustyle|тоник|tonic|bittersweet|voltage|pool|rap rose|ale|минеральн|cucunade|смузи/i },
    tea: { label: 'Чай / кофе', re: /чай|tea|каркаде|кофе|coffee|chai|earl|грей|darksupra/i },
    herbal: { label: 'Травы', re: /базилик|basil|шалфей|salbei|эстрагон|estragon|тархун|ромашк|chamomile|лаванд|lavender|лемонграсс|чабрец|магента|травы|herb|cilantro|кинз|щавел|огур|cucumber|алоэ|aloe|имбир|ginger|эвкалипт/i },
    floral: { label: 'Цветы / парфюм', re: /цвет|flower|роз|rose|пион|peon|фиалк|сирен|жасмин|лили|сакур|тюльпан|парфюм|perfume|balenciaga|ganymede|varanasi|ладан|мускус|замш|кожа|red \(|but not today|black afgano|buio|sandal|сандал|древес/i },
    conifer: { label: 'Хвоя', re: /хвоя|needl|ёлк|елк|сосн|таёжн|таежн|pine\b/i },
    spice: { label: 'Пряное', re: /пряно|перец|pepper|корица|гвоздик|бекон|bacon|салями|salami|гаспачо|gazpacho|кукуруз|corn|морков|carrot|олив|olive|сыр|чеддер|кунжут|sesame/i },
    nut: { label: 'Орехи / табачное', re: /орех|nut|фисташ|pistach|миндал|сигар|cigar|табачн|кофейн|сухофрукт|андре гигант|екатерина|николай|романовы/i },
    mint: { label: 'Мята', re: /мят|mint|wintergreen|пастил/i },
    cold: { label: 'Холодок', re: /supernova|ментол|menthol|\bice\b(?! snow)|\bcool\b|холод|\bicy\b/i },
  };
  const SOUR_RE = /кисл|sour|shock|лимон|lemon|лайм|lime|грейпфрут|grapefruit|клюкв|cranberr|смородин|currant|щавел|кизил|acid|барбарис|крыжовник|помело|pomel|киви|kiwi|гранат|бузин|ирга|облепих|маракуй|passion|tanos|pool|ревень|цитрус|citrus|ананас|pineapple|ananas|вишн|cherry|морс|тоник|bittersweet|грей/i;
  const SWEET_RE = /слад|sweet|десерт|печень|cookie|вафл|waffle|карамел|caramel|ирис|конфет|candy|пудинг|шоколад|chocolate|сгущ|milk|сливк|cream|крем|мёд|мед|honey|ваниль|vanil|маршмел|мороже|чизкейк|брауни|банан|banana|манго|mango|дын|melon|персик|peach|папай|papaya|клубни|strawberr|жвачк|gum|skittles|кола|cola|пончик|оладуш|хлопья|джем|jam|личи|арбуз|watermelon|груш|pear|marzipan|марципан/i;

  const PAIRS = {
    'berry+citrus': 3, 'berry+dessert': 2, 'berry+creamy': 2, 'berry+floral': 2, 'berry+herbal': 2, 'berry+conifer': 2, 'berry+tea': 2, 'berry+drink': 2, 'berry+tropic': 2, 'berry+fruit': 2, 'berry+cold': 1, 'berry+mint': 1,
    'citrus+tropic': 3, 'citrus+tea': 3, 'citrus+herbal': 3, 'citrus+drink': 2, 'citrus+fruit': 2, 'citrus+conifer': 2, 'citrus+floral': 1, 'citrus+mint': 2, 'citrus+cold': 2, 'citrus+dessert': -1, 'citrus+creamy': -1,
    'tropic+fruit': 2, 'tropic+creamy': 2, 'tropic+drink': 2, 'tropic+herbal': 1, 'tropic+dessert': 1, 'tropic+floral': 1, 'tropic+cold': 1,
    'fruit+dessert': 1, 'fruit+creamy': 1, 'fruit+herbal': 2, 'fruit+tea': 2, 'fruit+drink': 2, 'fruit+floral': 1, 'fruit+spice': 1, 'fruit+cold': 1,
    'dessert+creamy': 3, 'dessert+nut': 3, 'dessert+tea': 2, 'dessert+drink': 1, 'dessert+herbal': -2, 'dessert+cold': -2, 'dessert+mint': -1,
    'creamy+nut': 2, 'creamy+tea': 2, 'creamy+herbal': -1,
    'drink+herbal': 2, 'drink+tea': 1, 'drink+cold': 2, 'drink+mint': 2,
    'tea+herbal': 2, 'tea+floral': 2, 'tea+mint': 1,
    'herbal+floral': 1, 'herbal+conifer': 2, 'herbal+mint': 2, 'herbal+cold': 2,
    'floral+nut': 1, 'nut+spice': 1, 'conifer+cold': 2, 'conifer+mint': 2, 'spice+herbal': 1,
  };
  function pairScore(a, b) {
    let best = 0, worst = 0;
    for (const x of a) for (const y of b) {
      if (x === y) { best = Math.max(best, 1); continue; }
      const v = PAIRS[x + '+' + y] != null ? PAIRS[x + '+' + y] : (PAIRS[y + '+' + x] || 0);
      best = Math.max(best, v); worst = Math.min(worst, v);
    }
    return best + worst;
  }

  // Крепость брендов по умолчанию (1..5) — можно поменять в настройках
  const BRAND_STRENGTH = [
    [/black burn/i, 4], [/dark side|^ds\b/i, 4], [/tangiers|танж/i, 5], [/nuar|нуар/i, 4], [/blansh|бланш/i, 3],
    [/must have/i, 3], [/starline|старлайн/i, 2], [/sebero/i, 2], [/хулиган/i, 3], [/сарма/i, 3], [/северный/i, 4],
    [/bonche|бонч/i, 5], [/jent/i, 4], [/deus/i, 2], [/wto/i, 4], [/spectrum/i, 3], [/overdose/i, 3],
    [/trofimoff/i, 3], [/palitra/i, 2], [/afzal/i, 2], [/chaba/i, 1], [/kraken|marinage|d[оo]gma|dagma/i, 5], [/база/i, 3],
  ];
  function defaultBrandStrength(name) {
    for (const [re, v] of BRAND_STRENGTH) if (re.test(name)) return v;
    return 3;
  }

  function profile(flavor, brand) {
    if (flavor._p) return flavor._p;
    const text = flavor.name + ' ' + (flavor.note || '');
    let tags = (flavor.tags && flavor.tags.length) ? flavor.tags.slice() : Object.keys(TAGS).filter((t) => TAGS[t].re.test(text));
    if (!tags.length) tags = /parfum|парфюм/i.test(brand ? brand.name : '') ? ['floral'] : ['fruit'];
    let sour = 0.45;
    if (SOUR_RE.test(text)) sour += 0.35;
    if (SWEET_RE.test(text)) sour -= 0.3;
    if (/кисл|sour|shock|acid/i.test(text)) sour = 0.95;
    if (/ультракисл/i.test(text)) sour = 1;
    sour = Math.max(0, Math.min(1, sour));
    const strength = brand ? (brand.strength || defaultBrandStrength(brand.name)) : 3;
    const p = { tags, sour, strength };
    Object.defineProperty(flavor, '_p', { value: p, enumerable: false, configurable: true, writable: true });
    return p;
  }

  /**
   * Подбор микса.
   * req: { venue, likeBrands[], dislikeBrands[], likeTags[], dislikeTags[], likeFlavors[], dislikeFlavors[],
   *        baseTag, baseFlavor, strength(1..5), sour(0..100), bowl, heat, hookah, draw, cold, mint, novice }
   * ctx: { brands[], flavors[], stock{fid:{stock}} }
   */
  function recommendMix(req, ctx) {
    const brandById = Object.fromEntries(ctx.brands.map((b) => [b.id, b]));
    const bowl = req.bowl || autoBowl(req);
    const bowlGrams = BOWL_GRAMS[bowl] || 18;
    const targetSour = (req.sour != null ? req.sour : 50) / 100;
    const targetStrength = req.strength || 3;
    const dislikeText = (req.dislikeText || '').toLowerCase();

    const pool = [];
    for (const f of ctx.flavors) {
      const br = brandById[f.brandId];
      if (!br || br.kind !== 'tob' || f.hidden) continue;
      const st = ctx.stock[f.id] ? ctx.stock[f.id].stock : 0;
      if (st < 12) continue; // меньше чем на одну порцию
      if ((req.dislikeBrands || []).includes(br.name)) continue;
      if ((req.dislikeFlavors || []).includes(f.id)) continue;
      const p = profile(f, br);
      if (p.tags.some((t) => (req.dislikeTags || []).includes(t))) continue;
      if (dislikeText && dislikeText.split(/[,;]+/).map((s) => s.trim()).filter((s) => s.length > 2).some((w) => f.name.toLowerCase().includes(w))) continue;
      const isMint = p.tags.includes('mint'), isCold = p.tags.includes('cold');
      if (isMint && !req.mint) continue;
      if (isCold && !req.cold) continue;
      // индивидуальный балл
      let s = 0;
      const why = [];
      if (req.baseFlavor === f.id) { s += 8; why.push('вкус в основе'); }
      if (req.baseTag && p.tags.includes(req.baseTag)) { s += 4; why.push('основа: ' + TAGS[req.baseTag].label.toLowerCase()); }
      const liked = p.tags.filter((t) => (req.likeTags || []).includes(t));
      if (liked.length) { s += 2.5 * liked.length; why.push('любит ' + liked.map((t) => TAGS[t].label.toLowerCase()).join(', ')); }
      if ((req.likeFlavors || []).includes(f.id)) { s += 4; why.push('любимый вкус'); }
      if ((req.likeBrands || []).includes(br.name)) { s += 2; why.push('любимый бренд'); }
      s -= 4 * Math.abs(p.sour - targetSour);
      s += Math.min(1, Math.log10(st) - 1.3); // чуть приоритетнее то, чего много
      if (isCold && /supernova|ментол|menthol/i.test(f.name)) s += 2; // чистый холодок — лучший акцент
      pool.push({ f, br, p, stock: st, score: s, why, isMint, isCold });
    }
    if (pool.length < 2) return { error: 'Недостаточно вкусов в наличии под эти пожелания. Ослабьте фильтры.' };

    pool.sort((a, b) => b.score - a.score);
    let bases = pool.filter((c) => !c.isMint && !c.isCold);
    if (req.baseFlavor) bases = bases.filter((c) => c.f.id === req.baseFlavor).concat(bases.filter((c) => c.f.id !== req.baseFlavor));
    else if (req.baseTag) {
      const m = bases.filter((c) => c.p.tags.includes(req.baseTag));
      if (m.length) bases = m;
    }
    bases = bases.slice(0, 6);
    const partners = pool.slice(0, 40);
    const accents = pool.filter((c) => c.isMint || c.isCold).slice(0, 6);

    const RATIOS2 = [[60, 40], [70, 30], [50, 50]];
    const RATIOS3 = [[50, 30, 20], [60, 25, 15], [40, 40, 20]];
    const combos = [];
    const evalCombo = (parts, ratios) => {
      for (const r of ratios) {
        const share = parts.map((c, i) => ({ c, pct: r[i] }));
        const str = share.reduce((a, x) => a + x.c.p.strength * x.pct, 0) / 100;
        const sour = share.reduce((a, x) => a + x.c.p.sour * x.pct, 0) / 100;
        let s = share.reduce((a, x) => a + x.c.score * (x.pct / 100) * 1.6, 0);
        for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) s += 1.2 * pairScore(parts[i].p.tags, parts[j].p.tags);
        s -= 2.2 * Math.abs(str - targetStrength);
        s -= 3 * Math.abs(sour - targetSour);
        // требования: холодок/мята — обязательно в миксе
        if (req.cold && !parts.some((c) => c.isCold)) s -= 6;
        if (req.mint && !parts.some((c) => c.isMint)) s -= 6;
        // разнообразие: два одинаковых профиля — скучно
        if (parts.length > 1 && parts[0].p.tags.join() === parts[1].p.tags.join()) s -= 1;
        // хватит ли остатка
        if (share.some((x) => x.c.stock < bowlGrams * x.pct / 100 + 3)) s -= 10;
        s -= share.filter((x) => x.c.stock < 35).length * 0.8; // не добиваем последние граммы без нужды
        combos.push({ share, score: s, strength: str, sour });
      }
    };
    for (const b of bases) {
      for (const p of partners) {
        if (p.f.id === b.f.id || p.f.name === b.f.name) continue;
        if (!(req.cold || req.mint) || p.isMint || p.isCold) evalCombo([b, p], RATIOS2);
        for (const a of (req.cold || req.mint) ? accents : partners.slice(0, 15)) {
          if (a.f.id === b.f.id || a.f.id === p.f.id) continue;
          if (a.p.tags.includes('mint') || a.p.tags.includes('cold')) {
            evalCombo([b, p, a], [[55, 35, 10], [50, 35, 15]]);
          } else if (!(req.cold || req.mint)) {
            evalCombo([b, p, a], RATIOS3);
          }
        }
      }
    }
    combos.sort((a, b) => b.score - a.score);
    // уникальные по набору вкусов
    const seen = new Set(), picked = [];
    for (const c of combos) {
      const key = c.share.map((x) => x.c.f.id).sort().join('|');
      if (seen.has(key)) continue;
      // альтернативы с другой основой
      if (picked.length && picked.some((p) => p.share[0].c.f.id === c.share[0].c.f.id) && picked.length < 3 && combos.length > 50) {
        if (picked.filter((p) => p.share[0].c.f.id === c.share[0].c.f.id).length >= 1) continue;
      }
      seen.add(key);
      picked.push(c);
      if (picked.length === 3) break;
    }
    const fmt = (c) => ({
      parts: c.share.map((x) => ({
        flavorId: x.c.f.id, flavor: x.c.f.name, brand: x.c.br.name, pct: x.pct,
        grams: Math.round(bowlGrams * x.pct / 100), stock: x.c.stock, why: x.c.why,
      })),
      strength: Math.round(c.strength * 10) / 10,
      strengthLabel: STRENGTHS[Math.max(0, Math.min(4, Math.round(c.strength) - 1))],
      sour: Math.round(c.sour * 100),
      score: Math.round(c.score * 10) / 10,
    });
    return {
      best: fmt(picked[0]),
      alternatives: picked.slice(1).map(fmt),
      bowl, bowlGrams,
      heat: req.heat || autoHeat(bowl),
      tips: tips(req, bowl),
    };
  }

  function autoBowl(req) {
    const s = req.strength || 3;
    if (s >= 4) return 'Турка';
    if (s <= 2) return 'Гармошка';
    return 'Фанел';
  }
  function autoHeat(bowl) {
    if (bowl === 'Электронная чаша') return 'Без угля (электро)';
    if (bowl === 'Фрукт' || bowl === 'Турка') return 'Фольга';
    if (bowl === 'Гармошка') return 'Калауд · Лотус';
    return 'Калауд · Награни';
  }
  function tips(req, bowl) {
    const t = [];
    if (req.draw === 'Недиффузорная') t.push('Недиффузорная тяга — забивку делаем воздушнее, чтобы тяга не была тугой.');

  /** Текст заказа для отправки старшему КМ */
  function orderText(venue, date, author, lines) {
    const byBrand = {};
    for (const l of lines) (byBrand[l.brand] = byBrand[l.brand] || []).push(l);
    let out = `Заказ · ${venue} · ${date}\nИнвенту заполнил(а): ${author}\n`;

      for (const l of ls) { out += `— ${l.name}: ${l.qty} ${l.unit || 'г'}\n`; if ((l.unit || 'г') === 'г') total += l.qty; }

    out += `\nИтого табака: ${total} г`;

<script>
/* KM Box — демо-режим без сервера: данные в браузере (localStorage, иначе в памяти) */
(function () {
  'use strict';
  const KEY = 'kmbox.demo.v1';
  let mem = null;
  const uid = () => Math.random().toString(36).slice(2, 12);

  function seedDb() {
    const s = window.KM_SEED;
    const db = { users: [], sessions: {}, guests: [], brands: [], flavors: [], inventories: [], shifts: [], orders: [], settings: [] };
    db.users.push({ id: 'u1', login: 'admin', password: 'admin', firstName: 'Александр', lastName: 'Железной', role: 'admin' });
    db.users.push({ id: 'u2', login: 'km', password: 'km', firstName: 'Кальянный', lastName: 'Савенко', role: 'km' });
    db.guests = s.guests.map((g) => ({ ...g }));
    for (const [venue, c] of Object.entries(s.catalog)) {
      for (const b of c.brands) db.brands.push({ ...b, venue });
      for (const f of c.flavors) db.flavors.push({ ...f, venue });
    }
    db.inventories = s.inventories.map((i) => ({ ...i }));
    db.settings = [{ id: 'main', telegram: '', coverWeeks: 1.5, reserve: 30, minStep: 40 }];
    return db;
  }
  function load() {
    if (mem) return mem;
    try { const raw = localStorage.getItem(KEY); if (raw) { mem = JSON.parse(raw); return mem; } } catch (e) { /* noop */ }
    mem = seedDb();
    save();
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* в памяти */ } }
  const publicUser = (u) => u && ({ id: u.id, login: u.login, firstName: u.firstName, lastName: u.lastName, role: u.role });
  let current = null;
  const delay = (v) => new Promise((r) => setTimeout(() => r(v), 60));
  const fail = (m) => Promise.reject(new Error(m));
  const COLS = ['guests', 'brands', 'flavors', 'inventories', 'shifts', 'orders', 'settings'];

  window.API = {
    mode: 'demo',
    async login(login, password) {
      const u = load().users.find((x) => x.login.toLowerCase() === String(login).trim().toLowerCase() && x.password === password);
      if (!u) return fail('Неверный логин или пароль');
      current = u.id;
      try { sessionStorage.setItem(KEY + '.me', u.id); } catch (e) { /* noop */ }
      return delay(publicUser(u));
    },
    async logout() { current = null; try { sessionStorage.removeItem(KEY + '.me'); } catch (e) { /* noop */ } },
    async me() {
      if (!current) { try { current = sessionStorage.getItem(KEY + '.me'); } catch (e) { /* noop */ } }
      return publicUser(load().users.find((u) => u.id === current)) || null;
    },
    async changePassword(oldPassword, newPassword) {
      const u = load().users.find((x) => x.id === current);
      if (!u || u.password !== oldPassword) return fail('Текущий пароль неверный');
      u.password = newPassword; save(); return { ok: true };
    },
    async loadAll() {
      const db = load();
      return delay({
        settings: db.settings.find((s) => s.id === 'main') || {},
        guests: db.guests, brands: db.brands, flavors: db.flavors, inventories: db.inventories,
        shifts: db.shifts.slice(-50), orders: db.orders.slice(-50),
      });
    },
    async put(col, doc) {
      if (!COLS.includes(col)) return fail('Неизвестная коллекция');
      const db = load();
      const d = { ...doc, id: doc.id || uid(), updatedAt: new Date().toISOString() };
      const i = db[col].findIndex((x) => x.id === d.id);
      if (i >= 0) db[col][i] = d; else db[col].push(d);
      save(); return delay(d);
    },
    async del(col, id) { const db = load(); db[col] = db[col].filter((x) => x.id !== id); save(); return { ok: true }; },
    async listUsers() { return load().users.map(publicUser); },
    async saveUser(u) {
      const db = load();
      const me = db.users.find((x) => x.id === current);
      if (!me || me.role !== 'admin') return fail('Только для старшего КМ');
      if (!u.login || !u.lastName) return fail('Нужны логин и фамилия');
      if (db.users.some((x) => x.login.toLowerCase() === u.login.toLowerCase() && x.id !== u.id)) return fail('Такой логин уже есть');
      if (u.id) {
        const x = db.users.find((y) => y.id === u.id);
        Object.assign(x, { login: u.login, firstName: u.firstName, lastName: u.lastName, role: u.role });
        if (u.password) x.password = u.password;
      } else {
        if (!u.password) return fail('Задайте пароль');
        db.users.push({ id: uid(), login: u.login, password: u.password, firstName: u.firstName, lastName: u.lastName, role: u.role || 'km' });
      }
      save(); return { ok: true };
    },
    async deleteUser(id) { const db = load(); if (id === current) return fail('Нельзя удалить себя'); db.users = db.users.filter((u) => u.id !== id); save(); return { ok: true }; },
    resetDemo() { mem = seedDb(); save(); },
  };
})();

</script>

  /** Рисуем «обрезанный скриншот» таблицы на canvas */
  function drawChecklist(sh) {
    const cl = KM.CHECKLISTS[sh.kind];
    const d = KM.shiftDate(sh.kind);
    const sc = 2, W = 560, colA = 430, rowH = 21, pad = 10;
    const rows = cl.items.length;
    const H = pad * 2 + rowH * 2 + 8 + rowH * rows + rowH * 2.2;
    const c = document.createElement('canvas');
    c.width = W * sc; c.height = H * sc;
    const x = c.getContext('2d');
    x.scale(sc, sc);
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#000'; x.fillStyle = '#000'; x.textBaseline = 'middle';
    const L = pad, R = W - pad;
    let y = pad;
    const cell = (x0, x1, y0, h, text, opts) => {
      opts = opts || {};
      x.font = `${opts.bold ? 'bold ' : ''}${opts.size || 12.5}px Arial, Helvetica, sans-serif`;
      x.textAlign = opts.align || 'left';
      const tx = opts.align === 'center' ? (x0 + x1) / 2 : x0 + 4;
      let t = String(text);
      while (x.measureText(t).width > x1 - x0 - 8 && t.length > 3) t = t.slice(0, -2) + '…';
      x.fillText(t, tx, y0 + h / 2 + 0.5);
    };
    // шапка
    x.lineWidth = 1;
    cell(L, R, y, rowH * 1.2, 'НАЗВАНИЕ ЗАВЕДЕНИЕ: ' + sh.venue, { align: 'center', size: 13 });
    y += rowH * 1.2;
    x.lineWidth = 1.5; x.beginPath(); x.moveTo(L, y); x.lineTo(R, y); x.stroke();
    const dateTxt = sh.kind === 'open' ? 'ДАТА ' + KM.dmy(d) : KM.dmy(d);
    cell(L, L + colA, y, rowH * 1.2, dateTxt, { align: 'center', size: 13 });
    cell(L + colA, R, y, rowH * 1.2, cl.title, { align: 'center', size: 13 });
    y += rowH * 1.2;
    const top = y;
    // строки
    cl.items.forEach(([t], i) => {
      cell(L, L + colA, y, rowH, t);
      const m = sh.marks[i] || '';
      cell(L + colA, R, y, rowH, m, { align: m === '+' ? 'center' : 'left', size: 13 });
      y += rowH;
    });
    // сетка
    x.lineWidth = 0.8;
    for (let i = 0; i <= rows; i++) { x.beginPath(); x.moveTo(L, top + i * rowH); x.lineTo(R, top + i * rowH); x.stroke(); }
    x.beginPath(); x.moveTo(L, top); x.lineTo(L, y); x.moveTo(L + colA, top - rowH * 1.2); x.lineTo(L + colA, y); x.stroke();
    x.lineWidth = 2; x.strokeRect(L, top - rowH * 1.2, R - L, y - top + rowH * 1.2);
    y += rowH * 0.9;
    cell(L, L + colA, y, rowH, `${cl.responsibleLabel}: ${sh.responsible || ''}`, { align: sh.kind === 'open' ? 'center' : 'left', size: 13 });
    return c;
  }

  async function makeShot() {
    const sh = S.shift;
    const canvas = drawChecklist(sh);
    const url = canvas.toDataURL('image/png');
    const d = KM.shiftDate(sh.kind);
    const fname = `${sh.kind === 'open' ? 'открытие' : 'закрытие'}_${sh.venue}_${KM.dmy(d)}.png`;
    try {
      await save('shifts', { id: uid(), kind: sh.kind, venue: sh.venue, date: KM.ymd(d), responsible: sh.responsible, userId: S.user.id, missed: KM.CHECKLISTS[sh.kind].items.filter((_, i) => !sh.marks[i] || sh.marks[i] === 'Выкл').map((x) => x[0]), at: new Date().toISOString() });
    } catch (e) { /* лог смены не критичен */ }
    modal(`
      <div class="mh"><h3>${sh.kind === 'open' ? 'Открытие' : 'Закрытие'} · ${esc(sh.venue)}</h3><button class="iconbtn" data-close>${I.close}</button></div>
      <img class="shot" src="${url}" alt="Скрин чек-листа">
      <div class="hint">Если кнопки ниже недоступны — зажмите картинку (или ПКМ) → «Сохранить/Копировать изображение».</div>
      <div class="grid two" style="margin-top:12px">
        <button class="btn primary" id="shShare">${I.tg} Поделиться</button>
        <button class="btn" id="shCopy">Копировать</button>
        ${API.mode === 'demo' ? '' : `<a class="btn" id="shDl" href="${url}" download="${esc(fname)}">Скачать PNG</a>`}
        <button class="btn ghost" data-close>Готово</button>
      </div>`, (w) => {
      w.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeModal));
      $('#shShare').addEventListener('click', async () => {
        try {
          const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));

          if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: fname });
          else throw new Error('no share');
        } catch (e) { if (e && e.name === 'AbortError') return; toast('Поделиться не поддерживается здесь — скачайте или скопируйте картинку', 'err'); }
      });
      $('#shCopy').addEventListener('click', async () => {

        } catch (e) { toast('Браузер не дал скопировать картинку — зажмите её и выберите «Копировать»', 'err'); }

    });

          <label class="f"><span>Шаг пополнения, г</span><input class="input" name="step" type="number" min="40" step="5" value="${b.step || 40}"></label>
          <label class="f"><span>Крепость 1–5</span><input class="input" name="strength" type="number" min="1" max="5" value="${b.strength || KM.defaultBrandStrength(b.name || '')}"></label>
        </div>
        <div class="hint">Шаг — минимальная фасовка для дозаказа (не меньше 40 г). Крепость используется при подборе миксов.</div>
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-close>Отмена</button><button class="btn primary">Сохранить</button></div>
      </form>`);
    w.querySelectorAll('[data-close]').forEach((x) => x.addEventListener('click', closeModal));
    $('#brForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const doc = { ...b, id: b.id || uid(), name: fd.get('name').trim(), category: fd.get('category').trim(), step: Math.max(40, +fd.get('step') || 40), strength: Math.min(5, Math.max(1, +fd.get('strength') || 3)) };
      try { await save('brands', doc); S.data.flavors.forEach((f) => { if (f.brandId === doc.id) delete f._p; }); closeModal(); toast('Сохранено', 'ok'); render(); } catch (er) { toast(er.message, 'err'); }
    });
  }

  // ================= ИНВЕНТА =================
  function invDraftKey() { return 'invdraft.' + S.venue; }
  function startInv() {
    const draft = ls.get(invDraftKey(), null);
    if (draft && draft.date === KM.ymd(new Date())) { S.inv = draft; return; }
    S.inv = { venue: S.venue, date: KM.ymd(new Date()), values: {}, orders: {} };
  }
  function vInventory() {
    if (!S.inv || S.inv.venue !== S.venue) { startInv(); S.invStep = 'fill'; }
    return S.invStep === 'calc' ? vInvCalc() : vInvFill();
  }
  function vInvFill() {
    const prev = stockMap();
    const blocks = brandBlocks();
    const all = blocks.reduce((a, x) => a + x.items.length, 0);
    const filled = Object.values(S.inv.values).filter((v) => v !== '' && v != null).length;
    return `
      <div class="stack">
        <div class="row between wrap"><h1>Инвента · ${esc(S.venue)}</h1><a class="btn ghost sm" href="#stock">Назад</a></div>
        <div class="card grid two">
          <label class="f"><span>Заполняет</span><input class="input" value="${esc(fullName(S.user))}" disabled></label>
          <label class="f"><span>Дата</span><input class="input" value="${KM.dmy(KM.fromYmd(S.inv.date))}" disabled></label>
        </div>
        <div><div class="row between small"><span class="muted">Заполнено</span><span id="invProg">${filled} / ${all}</span></div><div class="bar" style="margin-top:6px"><i id="invBar" style="width:${all ? (filled / all) * 100 : 0}%"></i></div></div>
        <div class="hint">Вписывайте фактический вес в граммах (аксессуары — в штуках). Серым — прошлый остаток. Черновик сохраняется автоматически.</div>
        <div id="invBlocks">${blocks.map(({ b, items }, bi) => {
          const n = items.filter((f) => S.inv.values[f.id] !== undefined && S.inv.values[f.id] !== '').length;
          return `<details class="blk" ${bi === 0 ? 'open' : ''} data-b="${b.id}">
            <summary><span class="bn">${esc(b.name)}</span><span class="badge ${n === items.length ? 'green' : ''}" data-cnt>${n}/${items.length}</span><span class="chev">${I.chev}</span></summary>
            ${items.map((f) => { const v = S.inv.values[f.id]; const p = prev[f.id] ? prev[f.id].stock : null; return `<div class="fl ${v !== undefined && v !== '' ? 'filled' : ''}"><div class="nm">${esc(f.name)}<small>было: ${p == null ? '—' : fmtG(p)}</small></div><span class="muted small">${b.kind === 'tob' ? 'г' : f.unit || 'шт'}</span><input class="input" inputmode="decimal" data-f="${f.id}" value="${v == null ? '' : esc(v)}" placeholder="${p == null ? '' : fmtG(p)}"></div>`; }).join('')}
            <div class="row" style="padding:10px 14px;border-top:1px solid var(--line)"><button class="btn sm ghost" data-zero="${b.id}">Пустые = 0</button><button class="btn sm ghost" data-addfl="${b.id}">${I.plus} Вкус</button></div>
          </details>`;
        }).join('')}</div>
        <div class="sticky-actions"><button class="btn primary" id="invCalc">Рассчитать заказ</button></div>
      </div>`;
  }
  function saveDraft() { ls.set(invDraftKey(), S.inv); }
  function afterInventory() {
    if (S.invStep === 'calc') return afterInvCalc();
    const root = $('#invBlocks');
    const all = root.querySelectorAll('input[data-f]').length;
    root.addEventListener('input', (e) => {
      const i = e.target.closest('input[data-f]'); if (!i) return;
      const v = i.value.replace(',', '.').replace(/[^\d.]/g, '');
      if (v !== i.value.replace(',', '.')) i.value = v;
      if (v === '') delete S.inv.values[i.dataset.f]; else S.inv.values[i.dataset.f] = v;
      i.closest('.fl').classList.toggle('filled', v !== '');
      const blk = i.closest('details');
      const ins = [...blk.querySelectorAll('input[data-f]')];
      const n = ins.filter((x) => x.value !== '').length;
      const c = blk.querySelector('[data-cnt]'); c.textContent = n + '/' + ins.length; c.classList.toggle('green', n === ins.length);
      const filled = Object.keys(S.inv.values).length;
      $('#invProg').textContent = filled + ' / ' + all; $('#invBar').style.width = (filled / all) * 100 + '%';
      saveDraft();
    });
    root.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const ins = [...root.querySelectorAll('input[data-f]')];
      const i = ins.indexOf(e.target); if (i < 0) return;
      e.preventDefault();
      const nx = ins[i + 1]; if (nx) { const d = nx.closest('details'); if (!d.open) d.open = true; nx.focus(); }
    });
    root.querySelectorAll('[data-zero]').forEach((b) => b.addEventListener('click', () => {
      const blk = b.closest('details');
      blk.querySelectorAll('input[data-f]').forEach((i) => { if (i.value === '') { i.value = '0'; S.inv.values[i.dataset.f] = '0'; } });
      saveDraft(); render();
    }));
    root.querySelectorAll('[data-addfl]').forEach((b) => b.addEventListener('click', () => flavorForm(b.dataset.addfl)));
    $('#invCalc').addEventListener('click', async () => {
      const empty = all - Object.keys(S.inv.values).length;
      if (empty > 0) {
        const ok = await confirmBox(`Не заполнено позиций: ${empty}. Посчитать их как 0 г?`, 'Да, считать 0');
        if (!ok) return;
        root.querySelectorAll('input[data-f]').forEach((i) => { if (i.value === '') S.inv.values[i.dataset.f] = '0'; });
      }
      computeOrders();
      S.invStep = 'calc'; saveDraft(); render(); window.scrollTo(0, 0);
    });
  }
  function computeOrders() {
    const chainPrev = KM.sortedInv(S.data.inventories, S.venue).filter((i) => i.date < S.inv.date);
    const items = {};
    for (const [fid, v] of Object.entries(S.inv.values)) items[fid] = { stock: +v || 0 };
    const chain = chainPrev.concat([{ date: S.inv.date, items }]);
    const brandById = Object.fromEntries(venueBrands().map((b) => [b.id, b]));
    const st = settings();
    S.inv.calc = {};
    S.inv.orders = {};
    for (const f of venueFlavors()) {
      const b = brandById[f.brandId];
      if (!b || b.kind !== 'tob') continue;
      const u = KM.usage(chain, f.id, 2);
      const q = KM.suggestOrder(items[f.id] ? items[f.id].stock : 0, u, b.step, { coverWeeks: +st.coverWeeks || 1.5, reserve: st.reserve != null ? +st.reserve : 30, minStep: +st.minStep || 40 });
      S.inv.calc[f.id] = { spent: u.spent, days: u.days, weekly: Math.round(u.weekly) };
      if (q) S.inv.orders[f.id] = q;
    }
  }
  function vInvCalc() {
    const blocks = brandBlocks();
    let total = 0;
    const html = blocks.map(({ b, items }) => {
      const rows = items.filter((f) => b.kind !== 'tob' || S.inv.orders[f.id] || S.inv.showAll);
      if (!rows.length) return '';
      const sum = rows.reduce((a, f) => a + (+S.inv.orders[f.id] || 0), 0);
      if (b.kind === 'tob') total += sum;
      return `<details class="blk" open><summary><span class="bn">${esc(b.name)}</span>${b.kind === 'tob' ? `<span class="badge acc">${sum} г</span>` : ''}<span class="chev">${I.chev}</span></summary>
        <div class="fl" style="padding-top:4px;padding-bottom:4px"><span class="muted small">${b.kind === 'tob' ? 'остаток · расход за 2 нед.' : 'остаток'}</span><span></span><span class="muted small">заказ</span></div>
        ${rows.map((f) => { const c = S.inv.calc[f.id] || {}; return `<div class="fl"><div class="nm">${esc(f.name)}<small>${fmtG(+S.inv.values[f.id])} ${b.kind === 'tob' ? 'г · ушло ' + fmtG(c.spent) + ' г' + (c.days && c.days !== 14 ? ' за ' + c.days + ' дн.' : '') : f.unit || 'шт'}</small></div><span></span><input class="input" inputmode="numeric" data-o="${f.id}" value="${S.inv.orders[f.id] || ''}" placeholder="0" ${b.kind === 'tob' ? `step="${b.step || 40}"` : ''}></div>`; }).join('')}
      </details>`;
    }).join('');
    return `
      <div class="stack">
        <div class="row between wrap"><h1>Заказ · ${esc(S.venue)}</h1><button class="btn ghost sm" id="invBack">← К остаткам</button></div>
        <div class="card"><div class="row between"><div><div class="muted small">Итого табака к заказу</div><div class="head" style="font-size:28px" id="invTotal">${total} г</div></div><div class="muted small" style="text-align:right">${esc(fullName(S.user))}<br>${KM.dmy(KM.fromYmd(S.inv.date))}</div></div></div>
        <div class="hint">Расчёт: расход за 2 недели (было + заказ − стало) → нужно на ${settings().coverWeeks || 1.5} нед. + резерв ${settings().reserve != null ? settings().reserve : 30} г − остаток, округлено вверх до шага бренда (Nuar — 200 г, Deus парфюм — 40 г, и т.д.). Количества можно поправить.</div>
        <label class="check"><input type="checkbox" id="invAll" ${S.inv.showAll ? 'checked' : ''}> Показать все позиции</label>
        <div id="invOrders">${html || '<div class="empty">По расчёту дозаказ не нужен</div>'}</div>
        <div class="sticky-actions"><button class="btn primary" id="invSave">Сохранить инвенту</button></div>
      </div>`;
  }
  function afterInvCalc() {
    $('#invBack').addEventListener('click', () => { S.invStep = 'fill'; render(); });
    $('#invAll').addEventListener('change', (e) => { S.inv.showAll = e.target.checked; render(); });
    $('#invOrders').addEventListener('input', (e) => {
      const i = e.target.closest('input[data-o]'); if (!i) return;
      const v = i.value.replace(/[^\d]/g, ''); i.value = v;
      if (v === '' || v === '0') delete S.inv.orders[i.dataset.o]; else S.inv.orders[i.dataset.o] = +v;
      saveDraft();
      const brandById = Object.fromEntries(venueBrands().map((b) => [b.id, b]));
      const fl = Object.fromEntries(venueFlavors().map((f) => [f.id, f]));
      const t = Object.entries(S.inv.orders).reduce((a, [k, q]) => a + (fl[k] && brandById[fl[k].brandId].kind === 'tob' ? q : 0), 0);
      $('#invTotal').textContent = t + ' г';
    });
    $('#invSave').addEventListener('click', saveInventory);
  }
  async function saveInventory() {
    const existing = S.data.inventories.find((i) => i.venue === S.venue && i.date === S.inv.date);
    const items = {};
    for (const [fid, v] of Object.entries(S.inv.values)) items[fid] = { stock: +v || 0 };
    for (const [fid, q] of Object.entries(S.inv.orders)) { items[fid] = items[fid] || { stock: null }; items[fid].order = q; }
    const doc = { id: existing ? existing.id : uid(), venue: S.venue, date: S.inv.date, author: fullName(S.user), authorId: S.user.id, items };
    try {
      await save('inventories', doc);
      ls.del(invDraftKey());
      const text = buildOrderText(doc);
      S.inv = null; S.invStep = 'fill';
      sendModal(text);
      go('stock');
    } catch (er) { toast(er.message, 'err'); }
  }
  function buildOrderText(doc) {
    const brandById = Object.fromEntries(venueBrands(doc.venue).map((b) => [b.id, b]));
    const lines = [];
    for (const f of venueFlavors(doc.venue)) {
      const it = doc.items[f.id]; if (!it || !it.order) continue;
      const b = brandById[f.brandId];
      lines.push({ brand: b.name, name: f.name, qty: it.order, unit: b.kind === 'tob' ? 'г' : (f.unit || 'шт') });
    }
    return KM.orderText(doc.venue, KM.dmy(KM.fromYmd(doc.date)), doc.author, lines);
  }
  function tgLink(text) {
    const u = (settings().telegram || '').replace(/^@/, '').replace(/^https?:\/\/t\.me\//, '').trim();
    return u ? 'https://t.me/' + encodeURIComponent(u) : 'https://t.me/share/url?url=' + encodeURIComponent(' ') + '&text=' + encodeURIComponent(text);
  }
  function sendModal(text) {
    const w = modal(`
      <div class="mh"><h2>Инвента сохранена</h2><button class="iconbtn" data-close>${I.close}</button></div>
      <textarea class="input" style="min-height:220px;font-size:13px" readonly id="ordTxt">${esc(text)}</textarea>
      <div class="hint">${settings().telegram ? 'Текст заказа скопируется, откроется чат со старшим КМ — просто вставьте сообщение.' : 'Ник старшего КМ не задан в настройках — откроется выбор чата в Telegram.'}</div>
      <div class="grid two" style="margin-top:12px">
        <a class="btn primary" id="ordTg" href="${tgLink(text)}" target="_blank" rel="noopener">${I.tg} Отправить старшему КМ</a>
        <button class="btn" id="ordCopy">Скопировать текст</button>
      </div>`);
    w.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeModal));
    $('#ordTg').addEventListener('click', () => { copyText(text); });
    $('#ordCopy').addEventListener('click', async () => toast((await copyText(text)) ? 'Скопировано' : 'Не удалось скопировать', 'ok'));
  }

  // напоминание об инвенте
  function checkSunday() {
    if (!S.data || !KM.inventoryDue(S.data.inventories, S.venue)) return;
    const key = 'sundayDismiss.' + S.venue + '.' + KM.ymd(new Date());
    try { if (sessionStorage.getItem(key)) return; } catch (e) { /* noop */ }
    if ($('#modal') || S.route === 'inventory') return;
    const w = modal(`
      <div class="stripes" style="margin-bottom:16px"></div>
      <h2 class="accent">Необходимо заполнить инвенту</h2>
      <p class="muted">Воскресенье, ${esc(S.venue)}. Заполнит: <b style="color:#fff">${esc(fullName(S.user))}</b>, дата ${KM.dmy(new Date())}.</p>
      <div class="grid two"><button class="btn ghost" data-x="later">Позже</button><button class="btn primary" data-x="go">Заполнить</button></div>`);
    w.addEventListener('click', (e) => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      try { sessionStorage.setItem(key, '1'); } catch (er) { /* noop */ }
      closeModal();
      if (b.dataset.x === 'go') go('inventory');
    });
  }
  setInterval(checkSunday, 60000);

  // ================= ПРИЁМ ЗАКАЗА =================
  function guessFromGuest(g) {
    const o = {};
    const t = (g.likes + ' ' + g.strength).toLowerCase();
    if (/крепк/.test(t)) o.strength = 5; else if (/выше сред/.test(t)) o.strength = 4; else if (/ниже сред|лёгк|легк/.test(t)) o.strength = /ниже/.test(t) ? 2 : 1; else if (/средн/.test(t)) o.strength = 3;
    if (/кисл/.test(t)) o.sour = 75; if (/слад|десерт|не приторн/.test(t)) o.sour = /не приторн/.test(t) ? 45 : 25;
    const b = (g.bowl || '').toLowerCase();
    o.bowl = KM.BOWLS.find((x) => b.includes(x.toLowerCase().slice(0, 5))) || '';
    if (/грейпфрут|ананас|фрукт/.test(b)) o.bowl = 'Фрукт';
    const h = (g.hookah || '').toLowerCase();
    if (/матп|метп|mattp|мэтп|метр/.test(h)) o.hookah = 'Mattpear'; else if (/альф|alpha/.test(h)) o.hookah = 'AlphaHookah'; else if (/вук|wook/.test(h)) o.hookah = 'Wookah';
    if (/без диффуз/.test(h)) o.draw = 'Недиффузорная';
    const dis = (g.dislikes || '').toLowerCase();
    if (/мят/.test(dis)) o.mintNo = true;
    if (/холод/.test(dis)) o.coldNo = true;
    o.likeTags = Object.keys(KM.TAGS).filter((k) => !['mint', 'cold'].includes(k) && KM.TAGS[k].re.test(g.likes || ''));
    if (/супернов|холодок/.test(t) && !o.coldNo) o.cold = true;
    o.dislikeText = (g.dislikes || '').replace(/\bбез\b|\bнет\b|все остальн\S*|всё остальн\S*|по настроению|сам говорит|все сам говорит/gi, '');
    return o;
  }
  function newOrder(g) {
    const o = { guestId: g ? g.id : '', table: '', novice: false, likeBrands: [], dislikeBrands: [], likeTags: [], dislikeTags: [], baseTag: '', baseFlavor: '', strength: 3, sour: 50, bowl: '', heat: '', hookah: '', draw: 'Диффузорная', cold: false, mint: false, dislikeText: '' };
    if (g) Object.assign(o, guessFromGuest(g));
    return o;
  }
  function triChips(group, items, likes, dislikes) {
    return `<div class="chips" data-tri="${group}">${items.map(([k, t]) => `<button type="button" class="chip ${likes.includes(k) ? 'like' : dislikes.includes(k) ? 'dislike' : ''}" data-k="${esc(k)}">${esc(t)}</button>`).join('')}</div>`;
  }
  function vOrder() {
    if (!S.ord) S.ord = newOrder();
    if (S.mix) return vMix();
    const o = S.ord;
    const g = o.guestId && S.data.guests.find((x) => x.id === o.guestId);
    const tagItems = Object.entries(KM.TAGS).filter(([k]) => !['mint', 'cold'].includes(k)).map(([k, t]) => [k, t.label]);
    const brandItems = venueBrands().filter((b) => b.kind === 'tob').map((b) => [b.name, b.name]).filter((x, i, a) => a.findIndex((y) => y[0] === x[0]) === i);
    const seg = (name, opts, val) => `<div class="seg" data-seg="${name}">${opts.map((v) => `<button type="button" data-v="${esc(v)}" class="${val === v ? 'on' : ''}">${esc(v)}</button>`).join('')}</div>`;
    const baseF = o.baseFlavor && S.data.flavors.find((f) => f.id === o.baseFlavor);
    return `
      <div class="stack" id="ordRoot">
        <div class="row between wrap"><h1>Приём заказа</h1><span class="badge acc">${esc(S.venue)}</span></div>
        <div class="card stack">
          <div class="grid two">
            <label class="f"><span>Постоянный гость</span><select class="input" id="oGuest"><option value="">— новый гость —</option>${S.data.guests.filter((x) => x.venue === S.venue).concat(S.data.guests.filter((x) => x.venue !== S.venue)).map((x) => `<option value="${x.id}" ${o.guestId === x.id ? 'selected' : ''}>${esc(x.name)}${x.venue !== S.venue ? ' (' + esc(x.venue) + ')' : ''}</option>`).join('')}</select></label>
            <label class="f"><span>Стол / гость</span><input class="input" id="oTable" value="${esc(o.table)}" placeholder="напр. 7"></label>
          </div>
          ${g ? `<div class="small" style="border-left:3px solid var(--accent);padding-left:10px"><b>Любит:</b> ${esc(g.likes || '—')}<br><b>Не любит:</b> ${esc(g.dislikes || '—')}${g.bowl ? '<br><b>Чаша:</b> ' + esc(g.bowl) : ''}${g.notes ? '<br><b>Заметки:</b> ' + esc(g.notes) : ''}</div>` : ''}
          <button type="button" class="btn ${o.novice ? 'primary' : ''} block" id="oNovice">${o.novice ? '✓ Гость не разбирается' : 'Гость не разбирается'}</button>
        </div>

        ${o.novice ? '' : `<div class="card"><h3>Производители и бренды</h3><div class="hint" style="margin:4px 0 10px">Нажатие: ♥ любимый → ✕ нелюбимый → сброс</div>${triChips('brands', brandItems, o.likeBrands, o.dislikeBrands)}</div>`}

        <div class="card"><h3>Любимые и нелюбимые вкусы</h3><div class="hint" style="margin:4px 0 10px">Нажатие: ♥ любит → ✕ не любит → сброс</div>${triChips('tags', tagItems, o.likeTags, o.dislikeTags)}
          <label class="f" style="margin-top:12px"><span>Не любит (конкретно, через запятую)</span><input class="input" id="oDisText" value="${esc(o.dislikeText)}" placeholder="арбуз, банан, кокос"></label>
        </div>

        <div class="card"><h3>Какой вкус в основе</h3>
          <div class="chips" style="margin-top:10px" id="oBase">${tagItems.map(([k, t]) => `<button type="button" class="chip ${o.baseTag === k ? 'on' : ''}" data-k="${k}">${t}</button>`).join('')}</div>
          <div class="search" style="margin-top:12px">${I.search}<input class="input" id="oBaseQ" placeholder="или конкретный вкус из наличия…" value="${baseF ? esc(baseF.name) : ''}"></div>
          <div id="oBaseRes" class="list hidden" style="margin-top:6px;max-height:240px;overflow:auto"></div>
        </div>

        <div class="card stack">

  async function submitOrder() {

    const label = (o.table ? 'Стол ' + o.table : '') || (o.guestId ? (S.data.guests.find((g) => g.id === o.guestId) || {}).name : '') || 'Заказ';

    S.timers.push(timer); ls.set('timers', S.timers);
    S.mix = { res, timerId: timer.id, req: o, label };
    try { await save('orders', { id: uid(), venue: S.venue, at: new Date().toISOString(), user: fullName(S.user), guestId: o.guestId, table: o.table, request: o, mix: res.best }); } catch (e) { /* не критично */ }

  // ---------------- таймеры ----------------
  function fmtLeft(ms) {
    if (ms <= 0) return '00:00';
    const s = Math.ceil(ms / 1000);
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }
  function timerPill() {
    if (!S.timers.length) return '';
    const next = S.timers.slice().sort((a, b) => a.end - b.end)[0];
    const done = next.end <= Date.now();
    return `<button class="timer-pill ${done ? 'done' : ''}" id="tPill">${done ? '⏰ ' + esc(next.label) + ' — время!' : '⏱ ' + fmtLeft(next.end - Date.now()) + ' · ' + esc(next.label)}${S.timers.length > 1 ? ' +' + (S.timers.length - 1) : ''}</button>`;
  }
  function timersList() {
    return `<div class="list">${S.timers.slice().sort((a, b) => a.end - b.end).map((t) => `<div class="li" style="cursor:default"><div class="grow"><div class="title">${esc(t.label)} · ${esc(t.venue)}</div><div class="sub">${esc(t.mix)}</div></div><span class="head" style="font-size:20px;${t.end <= Date.now() ? 'color:var(--danger)' : ''}" data-tleft="${t.id}">${fmtLeft(t.end - Date.now())}</span><button class="iconbtn" data-tdel="${t.id}" title="Убрать">${I.close}</button></div>`).join('')}</div>`;
  }
  function timersModal() {
    const w = modal(`<div class="mh"><h2>Таймеры</h2><button class="iconbtn" data-close>${I.close}</button></div><div id="tList">${timersList()}</div>`);
    w.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeModal(); });
  }
  document.addEventListener('click', (e) => {
    const d = e.target.closest('[data-tdel]'); if (!d) return;
    S.timers = S.timers.filter((t) => t.id !== d.dataset.tdel); ls.set('timers', S.timers);
    const tl = $('#tList'); if (tl) tl.innerHTML = S.timers.length ? timersList() : '<div class="empty">Таймеров нет</div>';
    if (!$('#modal')) render(); else { const p = $('#tPill'); if (p) p.outerHTML = timerPill(); }
  });
  let audioCtx = null;
  function unlockAudio() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) { /* noop */ } }
  function beep() {
    try {
      if (!audioCtx) return;
      [0, 0.35, 0.7].forEach((t) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.25, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.3); o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.32); });
    } catch (e) { /* noop */ }
  }
  setInterval(() => {
    if (!S.timers.length) return;
    for (const t of S.timers) {
      if (!t.fired && t.end <= Date.now()) {
        t.fired = true; ls.set('timers', S.timers);
        toast(`⏰ ${t.label}: прошло 15 минут — проверьте кальян`, 'ok'); beep();
        try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) { /* noop */ }
        try { if (window.Notification && Notification.permission === 'granted') new Notification('KM Box', { body: `${t.label}: прошло 15 минут` }); } catch (e) { /* noop */ }
      }
    }
    const p = $('#tPill'); if (p) p.outerHTML = timerPill();
    document.querySelectorAll('[data-tleft]').forEach((el) => { const t = S.timers.find((x) => x.id === el.dataset.tleft); if (t) { el.textContent = fmtLeft(t.end - Date.now()); if (t.end <= Date.now()) el.style.color = 'var(--danger)'; } });
    const mt = $('#mTimer'); if (mt && S.mix) { const t = S.timers.find((x) => x.id === S.mix.timerId); if (t) mt.textContent = fmtLeft(t.end - Date.now()); }
  }, 1000);

      const doc = { id: u.id, firstName: fd.get('firstName').trim(), lastName: fd.get('lastName').trim(), login: fd.get('login').trim(), role: fd.get('role') };
      if (fd.get('password')) doc.password = fd.get('password');
      try { await API.saveUser(doc); closeModal(); toast('Сохранено', 'ok'); loadUsers(); } catch (er) { toast(er.message, 'err'); }
    });
  }

  // ---------------- старт ----------------
  boot().catch((e) => { document.getElementById('app').innerHTML = `<div class="login"><div class="box card"><h2>Не удалось загрузить</h2><p class="muted">${esc(e.message)}</p><button class="btn primary" onclick="location.reload()">Повторить</button></div></div>`; });
})();

</script>
</body>
</html>
